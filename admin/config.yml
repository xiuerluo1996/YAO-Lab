backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "people"
    label: "People"
    files:
      - name: "people"
        label: "People"
        file: "content/people.json"
        format: json
        fields:
          - label: "Postdoctoral Fellows"
            name: "postdocs"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Prefix", name: "prefix", widget: "string", default: "Dr." }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Profile link", name: "link", widget: "string", required: false }
              - { label: "Photo", name: "photo", widget: "image", required: false }
          - label: "PhD Students"
            name: "phd"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Prefix", name: "prefix", widget: "string", default: "Mr." }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Profile link", name: "link", widget: "string", required: false }
              - { label: "Photo", name: "photo", widget: "image", required: false }
          - label: "Alumni"
            name: "alumni"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Prefix", name: "prefix", widget: "string", required: false }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string", required: false }
              - { label: "Bio", name: "bio", widget: "text", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Profile link", name: "link", widget: "string", required: false }
              - { label: "Photo", name: "photo", widget: "image", required: false }

  - name: "publications"
    label: "Publications"
    files:
      - name: "publications"
        label: "Publications"
        file: "content/publications.json"
        format: json
        fields:
          - label: "Publications"
            name: "publications"
            widget: "list"
            summary: "{{fields.year}} — {{fields.title}}"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Authors", name: "authors", widget: "string" }
              - { label: "Journal", name: "journal", widget: "string" }
              - { label: "Link (DOI/URL)", name: "link", widget: "string", required: false }

  - name: "openings"
    label: "Join us"
    files:
      - name: "openings"
        label: "Openings"
        file: "content/openings.json"
        format: json
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - label: "Openings"
            name: "openings"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  - name: "portal"
    label: "Research Portal"
    files:
      - name: "portal_files"
        label: "Portal files"
        file: "content/portal-files.json"
        format: json
        fields:
          - label: "Files"
            name: "files"
            widget: "list"
            summary: "{{fields.category}} — {{fields.title}}"
            fields:
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Protocols 实验方案", value: "protocols" }
                  - { label: "SOPs 标准流程", value: "sops" }
                  - { label: "Datasets 数据集", value: "datasets" }
                  - { label: "Templates 模板", value: "templates" }
                  - { label: "Meeting 组会资料", value: "meeting" }
                  - { label: "Theses 毕业论文", value: "theses" }
              - { label: "Title", name: "title", widget: "string", required: true }
              - { label: "File", name: "file", widget: "file", required: true }
              - { label: "Description", name: "description", widget: "text", required: false }
