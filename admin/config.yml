backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "gallery"
    label: "Gallery"
    files:
      - name: "gallery"
        label: "Gallery"
        file: "content/gallery.json"
        format: json
        fields:
          - label: "Gallery events"
            name: "events"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "string", required: false, hint: "Example: 23 November 2026, 2026.11.23, or November 2026" }
              - { label: "Location", name: "location", widget: "string", required: false }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Conference report", value: "conference" }
                  - { label: "Oral presentation", value: "oral" }
                  - { label: "Poster presentation", value: "poster" }
                  - { label: "Lab activity", value: "lab" }
                  - { label: "Award", value: "award" }
                  - { label: "News", value: "news" }
              - { label: "Cover image", name: "cover", widget: "image", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - label: "Album images"
                name: "images"
                widget: "list"
                required: false
                summary: "{{fields.caption}}"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "External link", name: "link", widget: "string", required: false }

  - name: "people"
    label: "People"
    files:
      - name: "people"
        label: "People"
        file: "content/people.json"
        format: json
        fields:
          - label: "Research Assistant Professor"
            name: "rap"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Prefix", name: "prefix", widget: "string", default: "Dr." }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Profile link", name: "link", widget: "string", required: false }
              - { label: "Photo", name: "photo", widget: "image", required: false }
          - label: "Postdoctoral Fellows"
            name: "postdocs"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Prefix", name: "prefix", widget: "string", default: "Dr." }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Profile link", name: "link", widget: "string", required: false }
              - { label: "Photo", name: "photo", widget: "image", required: false }
          - label: "PhD Students"
            name: "phd"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Prefix", name: "prefix", widget: "string", default: "Mr." }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Profile link", name: "link", widget: "string", required: false }
              - { label: "Photo", name: "photo", widget: "image", required: false }
          - label: "Visiting Students"
            name: "visiting"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "From (Institution)", name: "from", widget: "string", required: false }
              - { label: "Period", name: "period", widget: "string", required: false }
          - label: "Research Assistants"
            name: "ra"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Prefix", name: "prefix", widget: "string", default: "Mr." }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Profile link", name: "link", widget: "string", required: false }
              - { label: "Photo", name: "photo", widget: "image", required: false }
          - label: "Alumni"
            name: "alumni"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Stay of period", name: "period", widget: "string", required: false }
              - { label: "Current status", name: "status", widget: "string", required: false }

  - name: "publications"
    label: "Publications"
    files:
      - name: "publications"
        label: "Publications"
        file: "content/publications.json"
        format: json
        fields:
          - label: "Publications"
            name: "publications"
            widget: "list"
            summary: "{{fields.year}} — {{fields.title}}"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Authors", name: "authors", widget: "string" }
              - { label: "Journal", name: "journal", widget: "string" }
              - { label: "Link (DOI/URL)", name: "link", widget: "string", required: false }

  - name: "openings"
    label: "Join us"
    files:
      - name: "openings"
        label: "Openings"
        file: "content/openings.json"
        format: json
        fields:
          - { label: "Intro", name: "intro", widget: "text" }
          - label: "Openings"
            name: "openings"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  - name: "portal"
    label: "Research Portal"
    files:
      - name: "portal_files"
        label: "Portal files"
        file: "content/portal-files.json"
        format: json
        fields:
          - label: "Files"
            name: "files"
            widget: "list"
            summary: "{{fields.category}} — {{fields.title}}"
            fields:
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Protocols 实验方案", value: "protocols" }
                  - { label: "SOPs 标准流程", value: "sops" }
                  - { label: "Datasets 数据集", value: "datasets" }
                  - { label: "Templates 模板", value: "templates" }
                  - { label: "Meeting 组会资料", value: "meeting" }
                  - { label: "Theses 毕业论文", value: "theses" }
              - { label: "Title", name: "title", widget: "string", required: true }
              - { label: "File", name: "file", widget: "file", required: true }
              - { label: "Description", name: "description", widget: "text", required: false }
