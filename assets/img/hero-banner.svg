      <circle cx="0" cy="0" r="7" fill="#7fd8c4"/>
    </g>
    <g transform="translate(1360,240)">
      <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="none" stroke="#14a58c" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="6" fill="#7fd8c4"/>
    </g>
    <g transform="translate(1140,300)">
