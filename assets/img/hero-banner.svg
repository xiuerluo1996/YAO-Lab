    <rect x="134" y="420" width="14" height="140" rx="4" fill="url(#gCyan)"/>
    <rect x="204" y="470" width="14" height="90" rx="4" fill="url(#gTeal)"/>
    <rect x="274" y="350" width="14" height="210" rx="4" fill="url(#gCyan)"/>
    <rect x="344" y="440" width="14" height="120" rx="4" fill="url(#gTeal)"/>
    <rect x="414" y="500" width="14" height="60" rx="4" fill="url(#gCyan)"/>
    <rect x="473" y="300" width="14" height="260" rx="4" fill="url(#gTeal)"/>
    <rect x="554" y="460" width="14" height="100" rx="4" fill="url(#gCyan)"/>
    <rect x="624" y="400" width="14" height="160" rx="4" fill="url(#gTeal)"/>
    <rect x="694" y="480" width="14" height="80" rx="4" fill="url(#gCyan)"/>
    <rect x="764" y="360" width="14" height="200" rx="4" fill="url(#gTeal)"/>
    <rect x="834" y="430" width="14" height="130" rx="4" fill="url(#gCyan)"/>
    <rect x="893" y="260" width="14" height="300" rx="4" fill="url(#gTeal)"/>
    <rect x="974" y="450" width="14" height="110" rx="4" fill="url(#gCyan)"/>
    <rect x="1044" y="380" width="14" height="180" rx="4" fill="url(#gTeal)"/>
    <rect x="1114" y="470" width="14" height="90" rx="4" fill="url(#gCyan)"/>
    <rect x="1173" y="320" width="14" height="240" rx="4" fill="url(#gTeal)"/>
    <rect x="1254" y="440" width="14" height="120" rx="4" fill="url(#gCyan)"/>
    <rect x="1324" y="490" width="14" height="70" rx="4" fill="url(#gTeal)"/>
    <rect x="1394" y="410" width="14" height="150" rx="4" fill="url(#gCyan)"/>
    <rect x="1464" y="465" width="14" height="95" rx="4" fill="url(#gTeal)"/>
