    <circle cx="180" cy="90" r="3" opacity="0.5"/>
    <circle cx="260" cy="250" r="4" opacity="0.4"/>
    <circle cx="400" cy="180" r="3" opacity="0.5"/>
    <circle cx="540" cy="90" r="4" opacity="0.4"/>
    <circle cx="760" cy="120" r="3" opacity="0.5"/>
    <circle cx="1020" cy="420" r="4" opacity="0.4"/>
    <circle cx="1180" cy="90" r="3" opacity="0.5"/>
    <circle cx="1500" cy="300" r="4" opacity="0.4"/>
