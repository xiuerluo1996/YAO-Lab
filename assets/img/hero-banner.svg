<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0b1f2a"/>
      <stop offset="0.55" stop-color="#123040"/>
      <stop offset="1" stop-color="#0e2a33"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0e7c6b"/>
      <stop offset="1" stop-color="#14a58c"/>
    </linearGradient>
    <linearGradient id="gCyan" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0aa8c9"/>
      <stop offset="1" stop-color="#4fd6e8"/>
    </linearGradient>
    <linearGradient id="gStrand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0aa8c9"/>
      <stop offset="1" stop-color="#7fd8c4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fd8c4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fd8c4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#7fd8c4" stroke-opacity="0.045">
    <path d="M0 80H1600M0 160H1600M0 240H1600M0 320H1600M0 400H1600M0 480H1600M0 560H1600"/>
    <path d="M100 0V640M200 0V640M300 0V640M400 0V640M500 0V640M600 0V640M700 0V640M800 0V640M900 0V640M1000 0V640M1100 0V640M1200 0V640M1300 0V640M1400 0V640M1500 0V640"/>
  </g>

  <!-- data strings (molecular data storage) -->
  <g fill="#7fd8c4" font-family="monospace" font-size="15" opacity="0.4">
    <text x="300" y="120">01 01 10 11</text>
    <text x="470" y="420">10 00 11 01</text>
    <text x="1080" y="90">01 11 00 10</text>
  </g>

  <!-- peptide chain (centre) -->
  <g>
    <path d="M560 420 C640 300 760 220 900 250 C1000 272 1050 200 1080 120" fill="none" stroke="url(#gStrand)" stroke-width="3" opacity="0.55"/>
    <g fill="#0e7c6b" stroke="#7fd8c4" stroke-width="2">
      <circle cx="560" cy="420" r="16"/>
      <circle cx="632" cy="330" r="16"/>
      <circle cx="712" cy="268" r="16"/>
      <circle cx="800" cy="240" r="16"/>
      <circle cx="890" cy="250" r="16"/>
      <circle cx="962" cy="258" r="16"/>
      <circle cx="1030" cy="214" r="16"/>
      <circle cx="1074" cy="140" r="16"/>
    </g>
    <g fill="#4fd6e8">
