      <circle cx="712" cy="268" r="6"/>
      <circle cx="890" cy="250" r="6"/>
      <circle cx="1074" cy="140" r="6"/>
    </g>
  </g>

  <!-- molecular network (right) -->
  <g fill="none" stroke-width="2">
    <line x1="1200" y1="160" x2="1360" y2="240" stroke="#14a58c" opacity="0.7"/>
    <line x1="1200" y1="160" x2="1140" y2="300" stroke="#14a58c" opacity="0.7"/>
    <line x1="1360" y1="240" x2="1440" y2="150" stroke="#0aa8c9" opacity="0.7"/>
    <line x1="1360" y1="240" x2="1280" y2="330" stroke="#0aa8c9" opacity="0.7"/>
    <line x1="1280" y1="330" x2="1140" y2="300" stroke="#0aa8c9" opacity="0.7"/>
    <line x1="1280" y1="330" x2="1420" y2="380" stroke="#14a58c" opacity="0.7"/>
